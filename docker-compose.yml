services:
  postgres:
    image: postgres:16-alpine
    container_name: stockhub-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: stockhub_admin
      POSTGRES_DB: stockhub_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
        test: ["CMD-SHELL", "pg_isready -U admin -d stockhub_db"]
        interval: 5s
        timeout: 5s
        retries: 5

volumes:
  pgdata: