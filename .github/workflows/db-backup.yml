name: DB Backup Producción (Cronjob 8h)

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

jobs:
  backup-postgres-prod:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente PostgreSQL 17 (pg_dump)
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Extraer y comprimir Dump DB Producción (.sql.gz)
        env:
          DATABASE_PUBLIC_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          PGSSLMODE: require
        run: |
          mkdir -p backups
          TIMESTAMP=$(date -u +"%Y%m%d_%H%M%S")
          BACKUP_FILE="backups/stockhub_prod_${TIMESTAMP}.sql.gz"
          
          pg_dump "$DATABASE_PUBLIC_URL" \
            --no-owner \
            --no-acl \
            --format=plain | gzip > "$BACKUP_FILE"
          
          if [ ! -s "$BACKUP_FILE" ]; then
            echo "❌ Error: El archivo de respaldo está vacío."
            exit 1
          fi
          
          echo "✅ Respaldo generado: $BACKUP_FILE ($(du -h "$BACKUP_FILE" | cut -f1))"

      - name: Guardar Dump en GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Dumps-DB-Produccion-${{ github.run_number }}
          path: ./backups/*.sql.gz
          retention-days: 30