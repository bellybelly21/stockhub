name: Load Testing (JMeter QA)

on:
  workflow_run:
    workflows: ["Deploy App to Railway"]
    types:
      - completed
  workflow_dispatch:

jobs:
  jmeter-performance:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        (
          github.event.workflow_run.event == 'pull_request' ||
          github.event.workflow_run.head_branch == 'qa'
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Esperar estabilización del contenedor en Railway QA
        run: sleep 20

      - name: Instalar Apache JMeter
        run: |
          JMETER_VERSION="5.6.3"
          wget https://dlcdn.apache.org//jmeter/binaries/apache-jmeter-${JMETER_VERSION}.tgz
          tar -xzf apache-jmeter-${JMETER_VERSION}.tgz
          sudo mv apache-jmeter-${JMETER_VERSION} /opt/jmeter
          sudo ln -s /opt/jmeter/bin/jmeter /usr/local/bin/jmeter

      - name: Ejecutar prueba de carga HTTPS contra stockhub-qa
        run: |
          mkdir -p jmeter-results
          
          jmeter -n \
            -t ./tests/performance/stockhub-load-test.jmx \
            -JHOST=${{ secrets.QA_API_HOST }} \
            -JPROTOCOL=https \
            -JPORT=443 \
            -JADMIN_EMAIL=${{ secrets.QA_ADMIN_EMAIL }} \
            -JADMIN_PASS=${{ secrets.QA_ADMIN_PASS }} \
            -JSELLER_EMAIL=${{ secrets.QA_SELLER_EMAIL }} \
            -JSELLER_PASS=${{ secrets.QA_SELLER_PASS }} \
            -l ./jmeter-results/results.jtl \
            -e -o ./jmeter-results/html-report

      - name: Subir Reportes JMeter a GitHub Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Reportes-JMeter-QA-${{ github.run_number }}
          path: ./jmeter-results/
          retention-days: 14