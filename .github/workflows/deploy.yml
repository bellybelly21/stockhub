name: Deploy App to Railway

on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias y verificar compilación (Server)
        working-directory: ./server
        run: |
          npm ci
          npm run build

      - name: Instalar dependencias y verificar compilación (Client)
        working-directory: ./client
        run: |
          npm ci
          npm run build

  deploy-qa-backend:
    needs: ci-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Desplegar Backend a Railway (QA)
        run: railway up --ci --service stockhub
        working-directory: ./server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_QA }}

  deploy-qa-frontend:
    needs: deploy-qa-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/qa'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Desplegar Frontend a Railway (QA)
        run: railway up --ci --service stockhub-frontend
        working-directory: ./client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_QA }}

  deploy-prod-backend:
    needs: ci-checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Desplegar Backend a Railway (Producción)
        run: railway up --ci --service stockhub
        working-directory: ./server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-prod-frontend:
    needs: deploy-prod-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Desplegar Frontend a Railway (Producción)
        run: railway up --ci --service stockhub-frontend
        working-directory: ./client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}