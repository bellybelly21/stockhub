name: Deploy App to Railway

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias del servidor
        run: npm ci
        working-directory: ./server

      - name: Generar cliente de Prisma
        run: npx prisma generate
        working-directory: ./server

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Desplegar Backend a Railway
        run: railway up --ci --service stockhub
        working-directory: ./server
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: deploy-backend
    steps:
      - name: Descargar codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Railway CLI
        run: npm i -g @railway/cli

      - name: Desplegar Frontend a Railway
        run: railway up --ci --service stockhub-frontend
        working-directory: ./client
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}